name: Trigger Homebrew Release
on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to publish to the Homebrew tap (e.g. 2026.10.28)"
        required: true

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      # Short-lived installation token minted from a GitHub App private key,
      # so there is no long-lived PAT that can expire.
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.HOMEBREW_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: pwndbg
          repositories: homebrew-tap
          permission-contents: write

      - name: Send
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          gh api --method POST \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            repos/pwndbg/homebrew-tap/dispatches \
            -f event_type=pwndbg_release \
            -f "client_payload[version]=$VERSION"
