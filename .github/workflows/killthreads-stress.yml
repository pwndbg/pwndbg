name: Killthreads stress

# Manual job for hunting the flaky `test_command_killthreads_kills_all_threads_except_current`.
# The kill is an inferior call, so any GDB error raised while evaluating it aborts the call and
# leaves the thread alive; `killthreads` prints that error, and this job also checks whether the
# debuginfod cache - which GDB reads during the second kill - got damaged.

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: "Rounds to run (each round runs `parallel` copies of the test)"
        default: "40"
      parallel:
        description: "Copies per round, to mimic the contention of a full test run"
        default: "8"

permissions:
  contents: read
  packages: read

jobs:
  stress:
    name: stress (${{ matrix.image }})
    strategy:
      fail-fast: false
      matrix:
        image: [fedora41, fedora42, fedora43, ubuntu24.04]

    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Loop the flaky test on ${{ matrix.image }}
        run: |
          docker compose run -T --rm --pull missing -v $(pwd):/pwndbg ${{ matrix.image }} bash -c '
            set -eu
            make -C /pwndbg/tests/binaries/host multiple_threads.native.out
            rm -rf /root/.cache/debuginfod_client    # start from fresh-container state

            rounds=${{ inputs.iterations }}
            parallel=${{ inputs.parallel }}
            failures=0
            forensics=/pwndbg/debuginfod-forensics
            mkdir -p $forensics
            set +e

            for round in $(seq "$rounds"); do
              for worker in $(seq "$parallel"); do
                ./tests.sh -d gdb -g gdb test_command_killthreads_kills_all \
                  > /tmp/run.$worker.log 2>&1 &
              done
              wait

              for worker in $(seq "$parallel"); do
                grep -q "Tests Failed : 0" /tmp/run.$worker.log && continue
                failures=$((failures + 1))
                echo "::group::FAILURE round $round worker $worker"
                cat /tmp/run.$worker.log
                echo "::endgroup::"
              done

              # A damaged cache entry makes every later symbol lookup throw, so check each round.
              # The ledger hashes every entry every round: an entry that was recorded ok and
              # later reads back damaged under the same inode and mtime was corrupted in place.
              python3 /pwndbg/scripts/inspect-debuginfod-cache.py \
                --ledger $forensics/ledger.tsv --tag round-$round > /tmp/cache.log 2>&1 && continue

              echo "::group::DAMAGED debuginfod cache after round $round"
              cat /tmp/cache.log
              df -h /root /tmp /pwndbg
              (rpm -q elfutils-debuginfod-client || dpkg-query -W libdebuginfod1) 2>/dev/null
              (dmesg -T | tail -20) 2>/dev/null || echo "dmesg not readable in container"
              cat /proc/pressure/io 2>/dev/null

              cp /tmp/cache.log $forensics/
              urls="${DEBUGINFOD_URLS:-$(cat /etc/debuginfod/*.urls 2>/dev/null | tr "\n" " ")}"
              for bad in $(grep -o "/root/\.cache/debuginfod_client/[0-9a-f]*/[a-z-]*" /tmp/cache.log | sort -u); do
                id=$(basename $(dirname $bad))
                cp $bad $forensics/$id.local
                echo "--- history of $id (was it ever healthy?)"
                grep $id $forensics/ledger.tsv
                # Pull it again a few times: if the server can serve a bad body, this may catch it.
                for attempt in 1 2 3; do
                  for url in $urls; do
                    curl -sS -m 120 -D $forensics/$id.headers.$attempt \
                      -o $forensics/$id.fresh.$attempt "$url/buildid/$id/debuginfo" && break
                  done
                  echo "server attempt $attempt: $(sha256sum $forensics/$id.fresh.$attempt 2>/dev/null)"
                done
                echo "local            : $(sha256sum $bad)"
                cmp $bad $forensics/$id.fresh.1
              done
              echo "::endgroup::"

              # Whole-file hexdump: inline with repeated lines collapsed (~18MB of log for a
              # 10MB entry), byte-for-byte into the artifact (~45MB of hex, ~5MB gzipped).
              echo "::group::hexdump of the damaged entries"
              python3 /pwndbg/scripts/inspect-debuginfod-cache.py --hexdump --hexdump-dir $forensics
              echo "::endgroup::"
              gzip -9 $forensics/*.hex
              chmod -R a+rX $forensics
              break
            done

            echo "TOTAL: $((rounds * parallel)) runs, $failures failures"
            test "$failures" -eq 0
          '

      - name: Upload debuginfod forensics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debuginfod-forensics-${{ matrix.image }}
          path: debuginfod-forensics/
          if-no-files-found: ignore
