name: Dev Docs
on: [push, pull_request, workflow_dispatch]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          sudo ln -s $HOME/.local/bin/uv /usr/bin/uv

      - name: Setup the necessary deps
        run: |
          # https://github.com/pwndbg/pwndbg/blob/dev/DEVELOPING.md#install-from-source-lldb
          sudo apt update
          sudo apt install -y gdb lldb-19 liblldb-19-dev
          echo "/usr/lib/llvm-19/bin/" >> $GITHUB_PATH
          echo "/usr/lib/llvm-19/bin/lldb-server" >> $GITHUB_PATH
          uv sync --extra lldb --group docs

      - name: Verify docs are up to date with source
        run: |
          # FIXME: Not sure why this line is needed, the verification
          # fails with "mdutils not found" if it is run first.
          # Doing a uv sync before running the script doesn't help.
          uv run gdb --batch -nx -ix ./gdbinit.py -nx
          ./scripts/verify_docs.sh

      - name: Update docs/index.md with README.md
        # This can be a simple copy if https://github.com/github/markup/issues/994
        # is solved.
        run: ./scripts/generate-readme.sh

      - name: Build site
        run: |
          # --only-group doesn't work with api-autonav (why?)
          uv run --group docs mkdocs build --strict

  deploy:
    if: github.event_name == 'push' && contains(fromJson('["refs/heads/dev"]'), github.ref)
    needs: check
    name: Deploy dev docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5

      - name: Install uv and sync deps
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          sudo ln -s $HOME/.local/bin/uv /usr/bin/uv

      - name: Update docs/index.md with README.md
        run: ./scripts/generate-readme.sh

      - name: Deploy site
        run: |
          # mike pushes commits to the gh-pages branch
          git config --global user.email "doc-bot@pwndbg.re"
          git config --global user.name "DocBot"
          git fetch --no-tags --prune --depth=1 origin +refs/heads/gh-pages:refs/remotes/origin/gh-pages
          uv run --group docs mike deploy \
            --update-aliases \
            --push \
            --remote origin \
            dev
