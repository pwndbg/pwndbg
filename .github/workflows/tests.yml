name: Tests
on:
  push:
    branches:
      - dev
  pull_request:

concurrency:
  # PRs: cancel in-progress runs (only test latest)
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Use dorny/paths-filter instead of on.paths so that skipped jobs report
  # as passed to branch protection, allowing docs-only PRs to merge.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!mkdocs.yml'
              - '!docs/**'
              - '!*.md'

  tests-using-nix:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        type: [qemu-user-tests, qemu-system-tests, tests, unit-tests]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Cache jemalloc build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pwndbg
          key: ${{ runner.os }}-jemalloc-${{ hashFiles('setup-dev.sh') }}

      - name: Install dependencies
        run: |
          ./setup-dev.sh --install-only

      - name: install uv
        run: nix profile install --inputs-from . nixpkgs#uv

      - name: Build pwndbg
        run: |
          nix build '.#pwndbg-dev' --accept-flake-config -o result

      # We set `kernel.yama.ptrace_scope=0` for `attachp` command tests
      - name: Setup
        run: |
          sudo sysctl -w kernel.yama.ptrace_scope=0

      - name: Run tests
        if: matrix.type == 'unit-tests'
        run: |
          ./unit-tests.sh

      - name: Run GDB Tests
        if: matrix.type == 'tests'
        run: |
          ./tests.sh --nix -d gdb -g gdb

      - name: Run DBG Tests on GDB
        if: matrix.type == 'tests'
        run: |
          ./tests.sh --nix -d gdb -g dbg

      - name: Run cross-arch tests
        if: matrix.type == 'qemu-user-tests'
        run: |
          ./tests.sh --nix -d gdb -g cross-arch-user

      - name: Download QEMU images
        if: matrix.type == 'qemu-system-tests'
        run: |
          # Would happen in the next step as well, but this way
          # it looks nicer in the CI.
          ./tests/library/qemu_system/download-kernel-images.sh

      - name: Run kernel tests
        if: matrix.type == 'qemu-system-tests'
        run: |
          ./kernel-tests.sh --nix

  qemu-system-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [ubuntu-22.04]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache uv downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}

      - name: Cache jemalloc build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pwndbg
          key: ${{ runner.os }}-jemalloc-${{ hashFiles('setup-dev.sh') }}

      - name: Setup pwndbg
        run: |
          ./setup.sh
          ./setup-dev.sh

      - name: Download images
        run: |
          ./tests/library/qemu_system/download-kernel-images.sh

      # We set `kernel.yama.ptrace_scope=0` for `gdb-pt-dump`
      - name: Run kernel tests
        run: |
          sudo sysctl -w kernel.yama.ptrace_scope=0
          ./kernel-tests.sh
