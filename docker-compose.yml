version: '3.8'

services:
  base: &base-spec
    build: .
    platform: linux/amd64
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_PTRACE

  main:
    <<: *base-spec
    volumes:
      - .:/pwndbg

  ubuntu22.04:
    <<: *base-spec
    build:
      context: .
      dockerfile: Dockerfile
      args:
        image: ubuntu:22.04

  ubuntu24.04:
    <<: *base-spec
    build:
      context: .
      dockerfile: Dockerfile
      args:
        image: ubuntu:24.04

  ubuntu24.04-mount:
    <<: *base-spec
    build:
      context: .
      target: base
      dockerfile: Dockerfile
      args:
        image: ubuntu:24.04
    volumes:
      - .:/pwndbg

  debian12:
    <<: *base-spec
    build:
      context: .
      dockerfile: Dockerfile
      args:
        image: debian:12

  lldb:
    <<: *base-spec
    build:
      context: .
      dockerfile: Dockerfile.lldb
      args:
        image: debian:12
    volumes:
      - .:/pwndbg

  archlinux:
    <<: *base-spec
    build:
      context: .
      dockerfile: Dockerfile.arch
      args:
        image: archlinux:latest

  hybrid:
    <<: *base-spec
    build:
      context: .
      dockerfile: Dockerfile.hybrid
    volumes:
      - .:/pwndbg
    working_dir: /pwndbg
    tty: true

  lldb19:              
    image: pwndbg/lldb19:jammy-base
    platform: linux/amd64
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    working_dir: /pwndbg         
    volumes:
      - .:/pwndbg      